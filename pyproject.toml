[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "grokbot-exporter"
version = "0.1.0"
description = "Export Grok Bot chats, profiles, skills, routines and files"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"

[project.urls]
Repository = "https://github.com/StefMVP/grokbot-exporter"

[project.scripts]
grokbot-exporter = "grokbot_exporter.cli:main"

[tool.setuptools.packages.find]
include = ["grokbot_exporter*"]

[tool.setuptools.package-data]
grokbot_exporter = ["*.js"]
"grokbot_exporter.adapters.openmaus" = ["README.md"]
